name: AegisPath CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy
        run: mypy src
        continue-on-error: true  # strict mode may need tuning in early stages

      - name: Bandit
        run: bandit -r src -ll
        continue-on-error: true

      - name: Pytest
        run: pytest -q --cov=aegispath --cov-report=term-missing

      - name: Charter presence
        run: |
          test -f docs/development-charter.md
          grep -q "Authorized Use Only" docs/development-charter.md
