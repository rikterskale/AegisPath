[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegispath"
version = "0.3.0"
description = "AI harness / security-tool factory for authorized red-team tooling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "AegisPath Contributors" }
]
keywords = ["security", "red-team", "ai-harness", "tooling", "verification"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Private :: Do Not Upload",  # Prevent accidental PyPI upload while pre-alpha
]

dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pre-commit>=3.0",
]
gui = [
    "streamlit>=1.28",
]

[project.scripts]
aegispath = "aegispath.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aegispath"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
